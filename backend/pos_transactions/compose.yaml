# Local Postgres + MinIO for pos_transactions dev/testing, on its own
# containers/ports/volumes — kept separate from any other local stack since
# spec 04's migration ran both this and the old backend/pos side by side for
# a while (that repo no longer exists, but there's no reason to renumber
# these ports back). No "app" service here: local dev runs the app on the
# host via `./gradlew :app-service:bootRun` instead (faster iteration, no
# image rebuild per code change) — see .env.local.example. The top-level
# Dockerfile (real multi-stage build, not deployment/'s scaffold
# placeholder) is what CI/CD uses for the actual deploy image.
#
# Usage (podman):
#   podman compose up -d              # postgres + minio
#   podman compose down                # stop, keep data
#   podman compose down -v             # stop and wipe volumes too

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: galfields-pos-transactions-postgres
    environment:
      POSTGRES_DB: pos_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - galfields-pos-transactions-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_transactions"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    container_name: galfields-pos-transactions-minio
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - galfields-pos-transactions-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  galfields-pos-transactions-postgres-data:
  galfields-pos-transactions-minio-data:
