server:
  port: "${SERVER_PORT:8080}"
spring:
  application:
    name: "pos_transactions"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    primary:
      jdbc-url: "${DB_URL_PRIMARY}"
      username: "${DB_USER_PRIMARY}"
      password: "${DB_PASSWORD_PRIMARY}"
    replica:
      jdbc-url: "${DB_URL_REPLICA}"
      username: "${DB_USER_REPLICA}"
      password: "${DB_PASSWORD_REPLICA}"
    driver-class-name: "org.postgresql.Driver"
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operationsSorter: "method"
    tagsSorter: "alpha"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
app:
  jwt:
    # HS256 needs >= 256 bits, no local default (same convention as the
    # DB_*/MINIO_* secrets) — generate one per environment, e.g.
    # `openssl rand -base64 32`.
    secret: "${JWT_SECRET}"
minio:
  endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
  public-endpoint: "${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}"
  access-key: "${MINIO_ACCESS_KEY:minioadmin}"
  secret-key: "${MINIO_SECRET_KEY:minioadmin}"
  bucket: "${MINIO_BUCKET:galfields-products}"
