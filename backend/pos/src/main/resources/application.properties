spring.application.name=pos
server.port=${SERVER_PORT:8080}

# Datasource (PostgreSQL is the cloud source of truth)
spring.datasource.primary.jdbc-url=${DB_URL_PRIMARY}
spring.datasource.primary.username=${DB_USER_PRIMARY}
spring.datasource.primary.password=${DB_PASSWORD_PRIMARY}
spring.datasource.replica.jdbc-url=${DB_URL_REPLICA}
spring.datasource.replica.username=${DB_USER_REPLICA}
spring.datasource.replica.password=${DB_PASSWORD_REPLICA}
spring.datasource.driverClassName=org.postgresql.Driver


# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# The cloud Postgres pod's schema was built by hand over time (a ConfigMap
# script in infra-repo-kinforgeworks, kept manually in sync with V1-V4's
# intent, since Flyway never actually ran there until this was fixed - see
# CLAUDE.md's "Database schema" section for the full incident writeup).
# Confirmed directly against the live DB: it already has V1 through V4's
# cumulative effect (stock_adjustments, payment_methods_images,
# sales_transactions.client_event_id, and the placeholder pos-terminal
# employee V4 inserts) - baseline at 4, not 1, or Flyway tries to re-run V2's
# CREATE TABLE against a table that's already there and fails exactly the
# same way. Only V5+ ever actually executes against that database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

# MinIO object storage (product images)
# minio.endpoint: internal address the backend uses to talk to MinIO directly (put/remove/bucket checks).
# minio.public-endpoint: CDN base URL returned to clients as a plain (unsigned) URL - the bucket is
# served publicly through the CDN, so this is string concatenation, not a presigned/signed URL.
# In production this MUST be set via MINIO_PUBLIC_ENDPOINT=https://cdn.galfields.kinforgeworks.com -
# it's indispensable, see the "Image URLs / CDN" note in CLAUDE.md. Left defaulted to minio.endpoint
# here so local dev (no CDN in front of the dev MinIO container) keeps working out of the box.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:galfields-products}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing key (HS256, needs >= 256 bits) for employee login (spec
# 01-login-empleados-roles) - see JwtService. Required, no local default,
# same convention as the DB_* secrets above: generate one per environment,
# e.g. `openssl rand -base64 32`.
app.jwt.secret=${JWT_SECRET}

# OpenAPI / Swagger UI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
