name: CI/CD — pos-backend (Spring Boot, Clean Architecture)

on:
  push:
    branches: [master]
    paths:
      - 'backend/pos_transactions/**'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push image
    uses: ./.github/workflows/_build-push.yml
    secrets: inherit
    with:
      # Same service name as backend/pos's old deploy-pos-backend.yml on
      # purpose — this is a code migration (layers -> clean architecture),
      # not a new k8s workload. Renaming this would point ArgoCD at a
      # deployment infra-repo-kinforgeworks doesn't have, instead of
      # replacing the image the existing pos-backend Service/Deployment
      # already runs (spec 04-migracion-pos-clean-architecture, Fase 10).
      service: pos-backend
      dockerfile: backend/pos_transactions/Dockerfile
      context: backend/pos_transactions

  # Same GitOps loop as the old workflow (see _build-push.yml + this job's
  # counterpart in the retired deploy-pos-backend.yml): pins
  # infra-repo-kinforgeworks's deployment.yaml to the new image sha so
  # ArgoCD picks it up.
  update-infra:
    name: Pin infra to new image
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Bobsuarez/infra-repo-kinforgeworks
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Pin pos-backend image to new sha tag
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          SHA_TAG: ${{ needs.build-push.outputs.sha-tag }}
        run: |
          cd infra
          sed -i \
            -e "s#image: ghcr.io/bobsuarez/galfields/pos-backend:.*#image: ${IMAGE}:${SHA_TAG}#" \
            apps/galfields/micro/deployment.yaml

      - name: Commit and push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/galfields/micro/deployment.yaml
          if git diff --cached --quiet; then
            echo "Sin cambios que desplegar"
            exit 0
          fi
          git commit -m "chore(galfields): deploy pos-backend (pos_transactions) ${{ needs.build-push.outputs.sha-tag }}"
          git push
