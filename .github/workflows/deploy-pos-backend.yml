name: CI/CD — pos-backend (Spring Boot)

on:
  push:
    branches: [master]
    paths:
      - 'backend/pos/**'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push image
    uses: ./.github/workflows/_build-push.yml
    secrets: inherit
    with:
      service: pos-backend
      dockerfile: backend/pos/Dockerfile
      context: backend/pos

  # Cierra el loop de GitOps: _build-push.yml ya publica un tag inmutable
  # (sha-<corto>), pero hasta ahora nada actualizaba infra-repo-kinforgeworks
  # para apuntar a él (deployment.yaml se quedaba en :latest, un tag flotante
  # que ArgoCD nunca vuelve a sincronizar porque el texto del manifest no
  # cambia). Este job pinea el manifest al sha recién construido y lo
  # commitea a infra — ESE commit es lo que ArgoCD sí detecta y sincroniza.
  update-infra:
    name: Pin infra to new image
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Bobsuarez/infra-repo-kinforgeworks
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Pin pos-backend image to new sha tag
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          SHA_TAG: ${{ needs.build-push.outputs.sha-tag }}
        run: |
          cd infra
          # Idempotente: en la primera corrida borra el TODO ya resuelto por
          # este mismo cambio; en corridas siguientes esas líneas ya no
          # existen, así que el -e de borrado simplemente no encuentra nada.
          sed -i \
            -e '/# TODO: confirmar si :latest existe como tag flotante/d' \
            -e '/# publica sha-<corto>); si no, fijar un sha real\./d' \
            -e "s#image: ghcr.io/bobsuarez/galfields/pos-backend:.*#image: ${IMAGE}:${SHA_TAG}#" \
            apps/galfields/micro/deployment.yaml

      - name: Commit and push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/galfields/micro/deployment.yaml
          if git diff --cached --quiet; then
            echo "Sin cambios que desplegar"
            exit 0
          fi
          git commit -m "chore(galfields): deploy pos-backend ${{ needs.build-push.outputs.sha-tag }}"
          git push