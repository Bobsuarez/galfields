name: Build — galfield-pos (Tauri desktop installers)

# Solo construye los instalables de escritorio (Windows/macOS/Linux) y los
# deja como artifacts del workflow. No hay deploy a servidor — es una app
# de escritorio, se distribuye descargando el instalador de aquí.

on:
  push:
    branches: [master]
    tags:
      - 'galfield-pos-v*'
    paths:
      - 'apps/galfield-pos/**'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: galfield-pos-windows
          - platform: macos-latest
            artifact-name: galfield-pos-macos
          # Ubuntu 20.04 no se soporta: Tauri 2 requiere libwebkit2gtk-4.1-dev,
          # inexistente en sus repos, y su runner hospedado en GitHub fue
          # retirado el 2025-04-15. Se compila por separado en 22.04 y 24.04
          # (en vez de un solo ubuntu-latest) para que cada .deb quede con las
          # dependencias correctas de esa versión y evitar enlazar contra
          # symbols de glibc/webkit más nuevos de lo necesario.
          - platform: ubuntu-22.04
            artifact-name: galfield-pos-linux-ubuntu22
          - platform: ubuntu-24.04
            artifact-name: galfield-pos-linux-ubuntu24

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/galfield-pos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Solo corre cuando el trigger fue un tag de versión (no en push a
      # master) — evita publicar un build bajo un tag que no coincide con lo
      # que el propio instalador reporta como su versión.
      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/galfield-pos-v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#galfield-pos-v}"
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::El tag dice v$TAG_VERSION pero tauri.conf.json dice $CONF_VERSION — actualiza la versión antes de taggear."
            exit 1
          fi
          echo "Versión verificada: $CONF_VERSION"

      # Dependencias nativas de Tauri en Linux (webkit2gtk, etc.)
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libudev-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/galfield-pos/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/galfield-pos/src-tauri -> target
          # Sin esto, rust-cache arma su key en base a runner.os — que es
          # "Linux" tanto para ubuntu-22.04 como ubuntu-24.04. Los dos legs
          # terminan compartiendo (y corriendo en paralelo sobre) la misma
          # cache, corrompiendo el target/ del otro a mitad de compilación:
          # eso produce errores intermitentes tipo "can't find crate for
          # `tauri`" en CI que no reproducen en local, con Cargo.toml/lock
          # perfectamente sanos.
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/galfield-pos

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.msi
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.exe
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.dmg
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.deb
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.rpm
            apps/galfield-pos/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 30
